name: Quality and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck, lint, and unit tests
        run: npm run check
      - name: Build production app
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test desktop and iPhone WebKit
        run: npm run test:e2e
      - name: Build GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Test repository-path installation and offline play
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: npx playwright test --grep 'app shell|small iPhone'
      - name: Retain browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain production app
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sugar-spell-web
          path: dist/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
